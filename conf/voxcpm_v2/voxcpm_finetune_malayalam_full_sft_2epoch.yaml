# Full-parameter Malayalam SFT: two passes over all accepted training rows.
# The AudioVAE remains frozen by the training code; all other model weights train.
pretrained_path: ${VOXCPM_PRETRAINED_PATH}
train_manifest: ${MALAYALAM_TRAIN_MANIFEST}
val_manifest: ${MALAYALAM_VAL_MANIFEST}
sample_rate: 16000
out_sample_rate: 48000
text_normalization: NFC

# Effective global batch = batch_size * grad_accum_steps * GPU count.
# num_iters is derived after over-length samples are filtered.
batch_size: 1
grad_accum_steps: 16
num_workers: 8
num_iters: 0
num_epochs: 2
log_interval: 10
valid_interval: 0
save_interval: 0
validate_at_epoch_end: true
save_at_epoch_end: true
eval_audio_samples: 4
save_eval_audio: true
eval_prompt_audio: ${VOXCPM_REPO_DIR}/assets/eval/Maya.wav
eval_prompt_text: I went to the store to buy some fresh fruits and snacks for the evening

# Full SFT uses a conservative learning rate to reduce catastrophic forgetting.
learning_rate: 0.00001
weight_decay: 0.01
warmup_steps: 800
max_steps: 0
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: ${VOXCPM_RUN_DIR}/checkpoints
tensorboard: ${VOXCPM_RUN_DIR}/tensorboard
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

# Deliberately no `lora` section: this selects full-parameter fine-tuning.
