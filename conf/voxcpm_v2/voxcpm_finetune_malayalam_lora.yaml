# Pilot configuration for Malayalam language adaptation on VoxCPM2.
# Paths are supplied by conf/slurm/alex.env on the cluster.
pretrained_path: ${VOXCPM_PRETRAINED_PATH}
train_manifest: ${MALAYALAM_TRAIN_MANIFEST}
val_manifest: ${MALAYALAM_VAL_MANIFEST}
sample_rate: 16000
out_sample_rate: 48000
text_normalization: NFC

# Effective global batch = batch_size * grad_accum_steps * GPU count.
batch_size: 1
grad_accum_steps: 16
num_workers: 8
num_iters: 1000
log_interval: 10
valid_interval: 500
save_interval: 250
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 100
max_steps: 1000
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: ${VOXCPM_RUN_DIR}/checkpoints
tensorboard: ${VOXCPM_RUN_DIR}/tensorboard
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
